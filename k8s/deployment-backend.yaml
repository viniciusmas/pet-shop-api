# Deployment do pet-shop-backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-shop-backend
  namespace: pet-shop
  labels:
    app: pet-shop-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pet-shop-backend
  template:
    metadata:
      labels:
        app: pet-shop-backend
    spec:
      containers:
        - name: app
          image: vinisouza/pet-shop-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/petshopdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "petshop"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "petshop123"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
# Serviço do pet-shop-backend
apiVersion: v1
kind: Service
metadata:
  name: pet-shop-backend
  namespace: pet-shop
spec:
  type: NodePort
  selector:
    app: pet-shop-backend
  ports:
    - port: 8081
      targetPort: 8081
---
# Grafana: datasource + dashboard (métricas do Prometheus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: pet-shop
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        jsonData:
          timeInterval: 15s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: pet-shop
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Pet-Shop
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
