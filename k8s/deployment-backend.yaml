        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0},
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"}
          },
          "pluginVersion": "10.2.3",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "Heap usado",
              "refId": "A"
            }
          ],
